# Bare-metal PVC version — requires local-path-provisioner:
#   kubectl apply -f https://raw.githubusercontent.com/rancher/local-path-provisioner/master/deploy/local-path-storage.yaml

apiVersion: v1
kind: Namespace
metadata:
  name: physio
  labels:
    name: physio

---

apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: physio-local-storage
provisioner: rancher.io/local-path
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer

---

apiVersion: apps/v1
kind: StatefulSet
metadata:
  namespace: physio
  name: physio-vnet
  labels:
    app: physio-vnet
spec:
  serviceName: physio-vnet
  replicas: 1
  selector:
    matchLabels:
      app: physio-vnet
  template:
    metadata:
      labels:
        app: physio-vnet
    spec:
      hostNetwork: true
      imagePullSecrets:
        - name: harbor-pull
      containers:
        - name: physio-vnet
          image: registry.layer-8.dev:44443/phy/physio-vnet:latest
          imagePullPolicy: Always
          env:
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          volumeMounts:
            - name: hdata
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: hdata
      spec:
        accessModes: [ "ReadWriteOnce" ]
        storageClassName: physio-local-storage
        resources:
          requests:
            storage: 5Gi

---

apiVersion: apps/v1
kind: StatefulSet
metadata:
  namespace: physio
  name: physio
  labels:
    app: physio
spec:
  serviceName: physio
  replicas: 1
  selector:
    matchLabels:
      app: physio
  template:
    metadata:
      labels:
        app: physio
    spec:
      imagePullSecrets:
        - name: harbor-pull
      # The agent calls the LLM and web tools at their public names (*.test-llm.dev). Inside the LAN the public
      # IP does not loop back, so the names resolve to the LAN load balancer that serves them.
      hostAliases:
        - ip: "192.168.1.121"
          hostnames: ["llm.test-llm.dev", "embed.test-llm.dev", "muse.test-llm.dev", "tools.test-llm.dev"]
      containers:
        - name: physio
          image: registry.layer-8.dev:44443/phy/physio:latest
          imagePullPolicy: Always
          env:
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          volumeMounts:
            - name: hdata
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: hdata
      spec:
        accessModes: [ "ReadWriteOnce" ]
        storageClassName: physio-local-storage
        resources:
          requests:
            storage: 10Gi

