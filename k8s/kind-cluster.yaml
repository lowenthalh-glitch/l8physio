kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: l8physio-e2e
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          taints:
            - key: "node-role.kubernetes.io/control-plane"
              effect: "NoSchedule"
  - role: worker
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8088
        protocol: TCP
