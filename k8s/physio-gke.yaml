# GKE deployment — GCE PD storage, single physio namespace
apiVersion: v1
kind: Namespace
metadata:
  name: physio
  labels:
    name: physio
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: physio-storage
provisioner: kubernetes.io/gce-pd
parameters:
  type: pd-standard
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  namespace: physio
  name: physio-data
  labels:
    app: physio
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: physio-storage
  resources:
    requests:
      storage: 50Gi
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  namespace: physio
  name: physio-vnet
  labels:
    app: physio-vnet
spec:
  selector:
    matchLabels:
      app: physio-vnet
  template:
    metadata:
      labels:
        app: physio-vnet
    spec:
      hostNetwork: true
      imagePullSecrets:
        - name: harbor-pull
      containers:
        - name: physio-vnet
          image: registry.layer-8.dev:44443/phy/physio-vnet:latest
          imagePullPolicy: Always
          env:
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          volumeMounts:
            - name: hdata
              mountPath: /data
      volumes:
        - name: hdata
          persistentVolumeClaim:
            claimName: physio-data
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  namespace: physio
  name: physio
  labels:
    app: physio
spec:
  serviceName: physio
  replicas: 1
  selector:
    matchLabels:
      app: physio
  template:
    metadata:
      labels:
        app: physio
    spec:
      imagePullSecrets:
        - name: harbor-pull
      containers:
        - name: physio
          image: registry.layer-8.dev:44443/phy/physio:latest
