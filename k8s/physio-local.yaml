# Local deployment — hostPath volumes, single physio namespace
apiVersion: v1
kind: Namespace
metadata:
  name: physio
  labels:
    name: physio
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  namespace: physio
  name: physio-vnet
  labels:
    app: physio-vnet
spec:
  selector:
    matchLabels:
      app: physio-vnet
  template:
    metadata:
      labels:
        app: physio-vnet
    spec:
      hostNetwork: true
      containers:
        - name: physio-vnet
          image: registry.layer-8.dev:44443/phy/physio-vnet:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          volumeMounts:
            - name: hdata
              mountPath: /data
      volumes:
        - name: hdata
          hostPath:
            path: /data
            type: DirectoryOrCreate
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  namespace: physio
  name: physio
  labels:
    app: physio
spec:
  serviceName: physio
  replicas: 1
  selector:
    matchLabels:
      app: physio
  template:
    metadata:
      labels:
        app: physio
    spec:
      # The agent calls the LLM and web tools at their public names (*.test-llm.dev). Inside the LAN the public
      # IP does not loop back, so the names resolve to the LAN load balancer that serves them.
      hostAliases:
        - ip: "192.168.1.121"
          hostnames: ["llm.test-llm.dev", "embed.test-llm.dev", "muse.test-llm.dev", "tools.test-llm.dev"]
      containers:
        - name: physio
          image: registry.layer-8.dev:44443/phy/physio:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          volumeMounts:
            - name: hdata
              mountPath: /data
      volumes:
        - name: hdata
          hostPath:
            path: /data
            type: DirectoryOrCreate
---
