# Local deployment — hostPath volumes, single physio namespace
apiVersion: v1
kind: Namespace
metadata:
  name: physio
  labels:
    name: physio
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  namespace: physio
  name: physio-vnet
  labels:
    app: physio-vnet
spec:
  selector:
    matchLabels:
      app: physio-vnet
  template:
    metadata:
      labels:
        app: physio-vnet
    spec:
      hostNetwork: true
      containers:
        - name: physio-vnet
          image: saichler/physio-vnet:latest
          imagePullPolicy: Always
          env:
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          volumeMounts:
            - name: hdata
              mountPath: /data
      volumes:
        - name: hdata
          hostPath:
            path: /data
            type: DirectoryOrCreate
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  namespace: physio
  name: physio
  labels:
    app: physio
spec:
  serviceName: physio
  replicas: 1
