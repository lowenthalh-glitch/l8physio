# KIND cluster version — uses KIND's built-in standard StorageClass
# KIND ships with rancher/local-path-provisioner pre-installed as StorageClass "standard"
# No custom StorageClass definition needed.
apiVersion: v1
kind: Namespace
metadata:
  name: physio
  labels:
    name: physio
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  namespace: physio
  name: physio-vnet
  labels:
    app: physio-vnet
spec:
  serviceName: physio-vnet
  replicas: 1
  selector:
    matchLabels:
      app: physio-vnet
  template:
    metadata:
      labels:
        app: physio-vnet
    spec:
      hostNetwork: true
      containers:
        - name: physio-vnet
          image: saichler/physio-vnet:latest
          imagePullPolicy: Always
          env:
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          volumeMounts:
            - name: hdata
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: hdata
      spec:
        accessModes: [ "ReadWriteOnce" ]
        storageClassName: standard
        resources:
          requests:
            storage: 5Gi
